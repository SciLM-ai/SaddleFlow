[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "saddleflow"
version = "0.1.0"
description = "Flow-matching generation of transition-state structures for periodic materials."
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [{name = "Ilgar Baghishov"}, {name = "Sung Hoon Jung"}, {name = "Graeme Henkelman"}]
dependencies = [
    # What `from saddleflow import SaddleFlow` needs. fairchem-core chooses torch (2.19-2.21 -> torch 2.8,
    # 2.22-2.23 -> torch 2.13); the released model is checked to reproduce its recorded endpoints on 2.21 and
    # 2.23. On Linux aarch64 (e.g. NVIDIA GH200) install a CUDA build of torch first; see the README.
    "fairchem-core>=2.19.0,<2.24",
    "numpy>=2.0,<2.5",
    "scipy>=1.15.0",
    "ase>=3.26.0",
    "huggingface_hub>=0.27.1",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/SciLM-ai/SaddleFlow"
Repository = "https://github.com/SciLM-ai/SaddleFlow"
Model = "https://huggingface.co/SciLM/SaddleFlow"
Dataset = "https://huggingface.co/datasets/SciLM/MaterialsSaddles"

[project.optional-dependencies]
# Sella converges proposals to verified saddles (saddleflow.search, `saddleflow search`). It pulls in jax.
search = ["sella>=2.5"]
# Same dependency under its older name, used by examples/MaterialsSaddles/sella_eval.py.
eval = ["sella>=2.5"]
# Training and the evaluation pipelines in examples/.
train = [
    "accelerate>=1.0.0",
    "lmdb>=1.6.2,<=1.7.3",
    "tqdm",
    "pyyaml",
    "wandb",
    "matplotlib>=3.7",
    "pyarrow",  # data_prep.py reads the MaterialsSaddles parquet metadata
]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff==0.5.1"]
extras = ["pymatgen>=2025.1.9"]

[project.scripts]
saddleflow = "saddleflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["saddleflow"]
