# SaddleMill CI-NEB, ONE band: the LiC_simpler training triplet's reactant and
# product (../one_saddle.traj frames 0 and 2, written to data/ by make_input.py).
# Serial mode (executorlib = False): runs directly on the GPU of the current node.
# Settings mirror the ones recorded in the training saddle's .info:
#   nimages = 7, interpolation = ase_linear, climbing image, fmax cutoff 0.01 eV/A.
[Main]
executorlib = False
method = NEB
dir_path = data
Optimizer = MDMin
jobs_per_gpu = 1
Calculator = FAIRChemCalculator
fmax = 0.01
steps = 3000

[FAIRChemCalculator]
device = cuda
name_or_path = uma-s-1p2
task_name = omat

[MDMin]
dt = 0.05
maxstep = 0.1

[LBFGS]
memory = 10
damping = 0.99
alpha = 200
maxstep = 0.1
use_line_search = False

[ourNEB]
only_endpoints_in_input_traj = True   # data/*.traj holds [R, P] only
images_location_in_input_traj = 0
relax_endpoints = True
endpoint_relax_Optimizer = LBFGS
endpoint_relax_fmax = 0.01
endpoint_relax_steps = 1000
interpolate_method = ase_linear
num_frames = 7                        # R + 5 intermediates + P, as in the training data
batch_size = 8

[BaseNEB]
k = 5
method = improvedtangent
climb = True
allow_shared_calculator = True
